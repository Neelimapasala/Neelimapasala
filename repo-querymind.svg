      <text x="422" y="199" text-anchor="end" font-family="'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="700" letter-spacing="2" fill="#00d4ff">VIEW PROJECT</text>
      <text x="430" y="200" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#00d4ff">→<animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="1.2s" repeatCount="indefinite"/></text>
