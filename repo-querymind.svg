      <text x="92" y="100" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#e6edf3" fill-opacity=".85"><tspan x="92" dy="0">Ask your database questions in plain English: an AI</tspan><tspan x="92" dy="18">agent writes the SQL, runs it and returns a clean</tspan><tspan x="92" dy="18">answer.</tspan></text>
